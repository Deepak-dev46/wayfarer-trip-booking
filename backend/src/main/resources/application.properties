spring.application.name=auth-service
server.port=8081

# ---------- MySQL ----------
spring.datasource.url=jdbc:mysql://localhost:3306/wayfarer_auth?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---------- JPA / Hibernate ----------
# ddl-auto=update is convenient for a skeleton/demo. Switch to "validate" and manage
# schema.sql / a migration tool (Flyway/Liquibase) before this goes anywhere near production.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ---------- JWT ----------
# 256-bit+ secret required for HS256. Replace with an env-injected secret before deploying anywhere real.
app.jwt.secret=CHANGE_ME_this_is_a_placeholder_secret_key_replace_before_deploying_32bytes_min
app.jwt.expiration-ms=3600000

# ---------- Actuator (health check only) ----------
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
