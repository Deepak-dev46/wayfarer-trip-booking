spring.application.name=wayfarer-backend
server.port=8085

# ---------- MySQL ----------
spring.datasource.url=jdbc:mysql://localhost:3306/MytripDb?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=admin@123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---------- JPA ----------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.open-in-view=false

# ---------- JWT ----------
# 256-bit+ secret, base64 encoded. Replace in production and load from env/secret manager.
app.jwt.secret=change-this-to-a-long-random-base64-secret-key-for-wayfarer-jwt-signing-please
app.jwt.expiration-ms=86400000

# ---------- CORS ----------
app.cors.allowed-origins=http://localhost:5173,http://localhost:3000

# ---------- Seed ----------
app.seed.enabled=true
app.seed.admin-email=admin@trip.com
app.seed.admin-password=admin123
