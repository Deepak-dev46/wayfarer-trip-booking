version: '3.9'
services:
  db:
    image: mysql:8.0
    container_name: trip-db
    environment:
      MYSQL_ROOT_PASSWORD: 05112003
      MYSQL_DATABASE: tripDbFinalNew
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p05112003"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: trip-backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/tripDbFinalNew?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: 05112003
      SPRING_PROFILES_ACTIVE: docker
      APP_CORS_ALLOWED_ORIGINS: http://ec2-34-202-124-205.compute-1.amazonaws.com:5173
    ports:
      - "8085:8085"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: trip-frontend
    depends_on:
      - backend
    environment:
      VITE_API_BASE_URL: http://ec2-34-202-124-205.compute-1.amazonaws.com:8085
    ports:
      - "5173:5173"
